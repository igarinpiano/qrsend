[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/igarinpiano/qrsend"
homepage = "https://igarinpiano.github.io/qrsend/"
rust-version = "1.89"

[profile.release]
lto = "thin"

# Smaller WebAssembly for the web app.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
