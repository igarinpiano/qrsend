name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: npm launcher unit tests
        run: node --test npm/launcher.test.js
      - name: npm packaging smoke test
        run: |
          for t in x86_64-unknown-linux-gnu arm-unknown-linux-gnueabihf; do
            mkdir -p "bins/$t"
            printf '#!/bin/sh\necho stub "$@"\n' > "bins/$t/qrsend"
          done
          python3 npm/assemble.py --version 0.0.0 --binaries bins --out npm-out
          find npm-out -name package.json | while read -r f; do
            (cd "$(dirname "$f")" && npm pack --dry-run > /dev/null)
          done
          test -f npm-out/@qrsend/cli-bin-linux-armv6/package.json
      - name: Shell scripts
        run: bash -n scripts/first-publish.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (compressed video export/import tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo test --workspace --release
      - name: The ffmpeg-dependent test must not have been skipped
        if: runner.os == 'Linux'
        run: cargo test --release -p qrsend compressed_video -- --nocapture 2>&1 | tee /dev/stderr | (! grep -q "skipping")
      - name: Core with the pure-Rust zstd backend (as in the web build)
        run: cargo test --release -p qrsend-core --no-default-features --features ruzstd
      - name: Build without window support
        run: cargo build -p qrsend --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install wasm-bindgen
        run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      - run: npm run check
      - run: npm run build
      - name: Build the CLI for interop tests
        run: cargo build --release -p qrsend --no-default-features
      - name: Install ffmpeg (video file test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
