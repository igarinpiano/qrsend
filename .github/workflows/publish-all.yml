# Publishes a release: GitHub Releases → npm → crates.io, in that fixed order.
# Pick the destinations when running it; unselected stages are skipped, and a
# failed stage stops the later ones. Manual only: Actions → publish-all → Run
# workflow. (Modeled on igarinpiano/dirlens.)
#
# Authentication uses Trusted Publishing (OIDC) for both registries — no
# tokens are stored in this repository.
#
# `ref` builds an existing tag instead of the selected branch (e.g. to add
# binaries to an older release). If the GitHub Release already exists, its
# assets are replaced/added instead of creating a new release.
#
# FIRST RELEASE ONLY — manual steps (trusted publishers can only be added to
# packages that already exist):
#   1. Run this workflow with only "GitHub Releases" selected (with `ref` set
#      to the tag when the release/tag already exists).
#   2. Locally run `scripts/first-publish.sh <version>`: it publishes the
#      crates (qrsend-core, then qrsend) and the npm packages (the platform
#      packages qrsend-bin-* and @qrsend/cli-bin-*, then qrsend-cli) built
#      from that GitHub Release.
#   3. crates.io → each crate → Settings → Trusted Publishing:
#        owner igarinpiano / repo qrsend / workflow publish-all.yml /
#        environment crates-io
#      npmjs.com → each package (qrsend-cli, every qrsend-bin-* and every
#      @qrsend/cli-bin-*) → Settings →
#      Trusted publishing → GitHub Actions:
#        owner igarinpiano / repo qrsend / workflow publish-all.yml /
#        environment npm
# After that, every release is just this workflow with everything selected.
#
# ADDING A PLATFORM LATER: its npm package does not exist yet, so the npm
# stage publishes everything else and then fails naming it. Publish it once
# with `scripts/npm-publish-remaining.sh <version> --trust` (which also adds
# its trusted publisher); the next release includes it automatically. The
# crates.io stage is skipped when the npm stage fails: run it again on its own.
name: publish-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (e.g. 0.1.1). Must match Cargo.toml; empty skips the check"
        required: false
      ref:
        description: "Tag/commit to build (empty = the branch selected above)"
        required: false
        default: ""
      publish_github_release:
        description: "Publish to GitHub Releases"
        type: boolean
        default: true
      publish_npm:
        description: "Publish to npm"
        type: boolean
        default: true
      publish_crates_io:
        description: "Publish to crates.io"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: ver
        env:
          # Inputs go through env, never straight into the script (injection).
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$v" ]; then
            echo "::error::Cargo.toml version ($v) does not match the input ($INPUT_VERSION)."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: ${{ inputs.publish_github_release || inputs.publish_npm }}
    uses: ./.github/workflows/reusable-build-matrix.yml # zizmor: ignore[self-repository] (the documented form)
    with:
      ref: ${{ inputs.ref }}

  web:
    needs: check-version
    if: ${{ inputs.publish_github_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: Install wasm-bindgen
        run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # (Nothing cached: what a release builds comes from the lockfile alone.)
          package-manager-cache: false
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
      - name: Package (offline copy of the web app)
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p web-out
          (cd web/dist && zip -qr "../../web-out/qrsend-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: web-out/

  github-release:
    needs: [check-version, build, web]
    if: |
      always() && inputs.publish_github_release &&
      needs.build.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its assets
      id-token: write  # sign the build provenance (Sigstore)
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: release
      - name: Archive binaries
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p release
          for t in binaries/*/; do
            t="${t%/}"; name="qrsend-$VERSION-$(basename "$t")"
            mkdir -p "pkg/$name"
            cp README.md LICENSE "$t"/* "pkg/$name/"
            if [ -f "$t/qrsend.exe" ]; then
              (cd pkg && zip -qr "../release/$name.zip" "$name")
            else
              chmod +x "pkg/$name/qrsend"
              tar -czf "release/$name.tar.gz" -C pkg "$name"
            fi
          done
          (cd release && sha256sum * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the GitHub Release (or update its assets)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION exists; uploading/replacing assets"
            gh release upload "v$VERSION" release/* --clobber
          else
            # Uses tag v$VERSION if it exists, otherwise creates it at the built commit.
            target="$(git rev-parse HEAD)"
            prerelease=""
            [[ "$VERSION" == 0.* || "$VERSION" == *-* ]] && prerelease="--prerelease"
            gh release create "v$VERSION" release/* --target "$target" --title "QRSend v$VERSION" --generate-notes $prerelease
          fi

  npm:
    needs: [check-version, build, github-release]
    if: |
      always() && inputs.publish_npm &&
      needs.build.result == 'success' &&
      needs.github-release.result != 'failure' && needs.github-release.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm Trusted Publishing (OIDC)
    steps:
      # (The packaging tools of the version being published, like its binaries.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Assemble npm packages
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: python3 npm/assemble.py --version "$VERSION" --binaries binaries --out npm-out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Publish (platform packages first, the main package last)
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # setup-node points NODE_AUTH_TOKEN at GITHUB_TOKEN, which a step env
          # cannot override; unset it so npm falls back to the OIDC exchange.
          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG
          # A package that cannot be published (typically a new one that has
          # no trusted publisher yet — see the header) must not block the
          # others: keep going, publish the main package, then fail the job.
          failed=""
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
            elif ! (cd "$1" && npm publish --access public --provenance); then
              echo "::error::could not publish $name@$VERSION"
              failed="$failed $name"
            fi
          }
          for d in npm-out/qrsend-bin-* npm-out/@qrsend/*; do
            [ -d "$d" ] && publish "$d"
          done
          publish npm-out/qrsend-cli
          if [ -n "$failed" ]; then
            echo "::error::not published:$failed — publish them once by hand (scripts/npm-publish-remaining.sh $VERSION) and add their trusted publishers"
            exit 1
          fi

  crates-io:
    needs: [check-version, github-release, npm]
    if: |
      always() && inputs.publish_crates_io &&
      needs.github-release.result != 'failure' && needs.github-release.result != 'cancelled' &&
      needs.npm.result != 'failure' && needs.npm.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write  # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Authenticate with crates.io (OIDC / Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish qrsend-core, then qrsend
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          published() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' \
              -H "User-Agent: qrsend-ci (+https://github.com/igarinpiano/qrsend)" \
              "https://crates.io/api/v1/crates/$1/$VERSION")" = "200" ]
          }
          if published qrsend-core; then echo "qrsend-core $VERSION already published"; else cargo publish -p qrsend-core --locked; fi
          # Wait for the index so qrsend can resolve its new qrsend-core.
          for i in $(seq 1 30); do published qrsend-core && break; sleep 5; done
          if published qrsend; then echo "qrsend $VERSION already published"; else cargo publish -p qrsend --locked; fi
      # cargo publish leaves target/package/, which trips rust-cache's cleanup.
      - name: Clean target/package
        if: always()
        run: rm -rf target/package
