name: Pages

# Builds the web app on every push to main and deploys it to GitHub Pages
# when Pages is available (public repository, Settings → Pages → Source:
# GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build (which runs npm and cargo with all their dependencies) only
# reads; writing to Pages is the deploy job's alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: Install wasm-bindgen
        run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write  # deploy to GitHub Pages
      id-token: write  # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
