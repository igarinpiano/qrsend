# Builds every release target without publishing anything — for checking the
# build matrix after changing targets or dependencies.
name: build-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/commit to build (empty = the branch selected above)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build-matrix.yml # zizmor: ignore[self-repository] (the documented form)
    with:
      ref: ${{ inputs.ref }}

  summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Built targets and npm packages
        run: |
          ls binaries | sed 's/^/built: /'
          python3 npm/assemble.py --version 0.0.0 --binaries binaries --out npm-out
          find npm-out -name package.json | sort
