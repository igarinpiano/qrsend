# Builds the qrsend CLI release binaries for every target and uploads them as
# artifacts (bin-<target>). Shared by publish-all.yml and build-check.yml; add
# or change targets here only.
#
# - Native runners build macOS and Windows directly.
# - Linux, Android and the BSDs use cross (cross-rs): zstd-sys compiles C, and
#   cross images bring the C toolchain for each target plus an old glibc.
#   Native ubuntu-latest builds would require a new glibc ("Check glibc floor").
#   `cross: true` is the tagged cross release, whose images link against old
#   glibc versions; `cross: git` is cross from its main branch, used only for
#   targets the release cannot build (LoongArch, NetBSD, current Android NDKs) — its
#   images are much newer (glibc 2.39), so it must not be used for the rest.
# - `features: --no-default-features` drops the window display (minifb). It is
#   used where dlopen of X11/Wayland cannot work (static musl) or makes no
#   sense (Android, BSDs, small boards); those builds show codes in the
#   terminal or export them. `--features webrtc` puts back the connection to
#   browsers, which `--no-default-features` drops as well; NetBSD goes without
#   it (the C library its DTLS part needs, aws-lc, does not link there).
# - `optional: true` targets may fail without stopping the other builds, so
#   that one run shows everything that is wrong. They are not optional to a
#   release, though: the `complete` job at the end fails unless every target
#   of the matrix was built (0.1.7 went out without its FreeBSD build, and
#   nobody had decided that). A caller that means to go on without a target
#   says so with `allow_missing`.
#
# npm packages are made for the targets listed in npm/assemble.py; the rest
# (Windows GNU, the macOS universal binary) ship on GitHub Releases only.
name: build-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        type: string
        default: ""
      allow_missing:
        description: "Succeed although a target could not be built (it is reported, and left out)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── required ─────────────────────────────────────────────
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true, features: --no-default-features --features webrtc }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true, features: --no-default-features --features webrtc }
          # ── optional: more Windows / macOS flavors ──────────────
          - { target: i686-pc-windows-msvc, os: windows-latest, optional: true }
          - { target: x86_64-pc-windows-gnu, os: windows-latest, optional: true }
          - { target: universal-apple-darwin, os: macos-latest, universal: true, optional: true }
          # ── optional: more Linux ─────────────────────────────────
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: powerpc64le-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: s390x-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: loongarch64-unknown-linux-gnu, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features --features webrtc }
          # ── optional: Android (Termux) and BSDs ──────────────────
          - { target: aarch64-linux-android, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features --features webrtc }
          - { target: armv7-linux-androideabi, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features --features webrtc }
          - { target: x86_64-linux-android, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features --features webrtc }
          - { target: i686-linux-android, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features --features webrtc }
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
          - { target: x86_64-unknown-netbsd, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          - { target: x86_64-unknown-illumos, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features --features webrtc }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    defaults:
      run:
        shell: bash
    # (The matrix reaches the scripts through the environment, never pasted
    # into them.)
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # rustup itself (on every runner) rather than an action that wraps it:
      # one third-party action fewer.
      - name: Install Rust (stable)
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$RUST_TARGETS"
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (release)
        if: matrix.cross == true
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross
      - name: Install cross (git)
        if: matrix.cross == 'git'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked --force
      - name: Build (release, native)
        if: ${{ !matrix.cross && !matrix.universal }}
        # ($FEATURES is several words on purpose.)
        run: cargo build --release --locked -p qrsend --target "$TARGET" $FEATURES
      - name: Build (release, cross)
        if: matrix.cross
        run: cross build --release --locked -p qrsend --target "$TARGET" $FEATURES
      - name: Build (release, macOS universal)
        if: matrix.universal
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p qrsend --target "$t"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/qrsend \
            target/aarch64-apple-darwin/release/qrsend target/x86_64-apple-darwin/release/qrsend
          lipo -info target/universal-apple-darwin/release/qrsend
      - name: Check glibc floor
        # Required glibc builds must run on RHEL 8 / Debian 10 (glibc 2.28).
        if: contains(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          bin="target/$TARGET/release/qrsend"
          need="$(readelf -V --wide "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "max GLIBC required by $TARGET: ${need:-none}"
          if [ -n "$MAX_GLIBC" ] && [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::$TARGET requires GLIBC_$need (> $MAX_GLIBC)"
            exit 1
          fi
      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          exe=qrsend; [[ "$TARGET" == *windows* ]] && exe=qrsend.exe
          "target/$TARGET/release/$exe" --version
      - name: Collect
        run: |
          mkdir -p "out/$TARGET"
          exe=qrsend; [[ "$TARGET" == *windows* ]] && exe=qrsend.exe
          cp "target/$TARGET/release/$exe" "out/$TARGET/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: out/

  # Every target of the matrix above, or none: a build that failed must not
  # go unnoticed into a release (an `optional` one does not fail the run by
  # itself).
  complete:
    name: every target built
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # (The matrix of the workflow that is running, not that of the ref it
      # builds: this file as it is here.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/reusable-build-matrix.yml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Compare what was built with the matrix
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing }}
        run: |
          wanted="$(grep -oE '\{ target: [A-Za-z0-9_-]+' .github/workflows/reusable-build-matrix.yml | awk '{print $3}' | sort -u)"
          built="$(ls binaries 2> /dev/null | sort -u)"
          missing="$(comm -23 <(echo "$wanted") <(echo "$built"))"
          echo "built $(echo "$built" | grep -c .) of $(echo "$wanted" | grep -c .) targets"
          [ -z "$missing" ] && exit 0
          if [ "$ALLOW_MISSING" = "true" ]; then
            for t in $missing; do echo "::warning::not built, and left out as asked: $t"; done
            exit 0
          fi
          for t in $missing; do echo "::error::not built: $t"; done
          echo "::error::Nothing is published with a target missing. Fix the build, or run again with the missing target allowed."
          exit 1
