# Builds the qrsend CLI release binaries for every target and uploads them as
# artifacts (bin-<target>). Shared by publish-all.yml and build-check.yml; add
# or change targets here only.
#
# - Native runners build macOS and Windows directly.
# - Linux, Android and the BSDs use cross (cross-rs): zstd-sys compiles C, and
#   cross images bring the C toolchain for each target plus an old glibc.
#   Native ubuntu-latest builds would require a new glibc ("Check glibc floor").
#   `cross: true` is the tagged cross release, whose images link against old
#   glibc versions; `cross: git` is cross from its main branch, used only for
#   targets the release cannot build (LoongArch, NetBSD, current Android NDKs) — its
#   images are much newer (glibc 2.39), so it must not be used for the rest.
# - `features: --no-default-features` drops the window display (minifb). It is
#   used where dlopen of X11/Wayland cannot work (static musl) or makes no
#   sense (Android, BSDs, small boards); those builds show codes in the
#   terminal or export them.
# - `optional: true` targets may fail without failing the release: they are
#   best-effort platforms, and a missing binary just means no package for it.
#
# npm packages are made for the targets listed in npm/assemble.py; the rest
# (Windows GNU, the macOS universal binary) ship on GitHub Releases only.
name: build-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── required ─────────────────────────────────────────────
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true, features: --no-default-features }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true, features: --no-default-features }
          # ── optional: more Windows / macOS flavors ──────────────
          - { target: i686-pc-windows-msvc, os: windows-latest, optional: true }
          - { target: x86_64-pc-windows-gnu, os: windows-latest, optional: true }
          - { target: universal-apple-darwin, os: macos-latest, universal: true, optional: true }
          # ── optional: more Linux ─────────────────────────────────
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: powerpc64le-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: s390x-unknown-linux-gnu, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: loongarch64-unknown-linux-gnu, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          # ── optional: Android (Termux) and BSDs ──────────────────
          - { target: aarch64-linux-android, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          - { target: armv7-linux-androideabi, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          - { target: x86_64-linux-android, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          - { target: i686-linux-android, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
          - { target: x86_64-unknown-netbsd, os: ubuntu-latest, cross: git, optional: true, features: --no-default-features }
          - { target: x86_64-unknown-illumos, os: ubuntu-latest, cross: true, optional: true, features: --no-default-features }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (release)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install cross (git)
        if: matrix.cross == 'git'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked --force
      - name: Build (release, native)
        if: ${{ !matrix.cross && !matrix.universal }}
        run: cargo build --release --locked -p qrsend --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Build (release, cross)
        if: matrix.cross
        run: cross build --release --locked -p qrsend --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Build (release, macOS universal)
        if: matrix.universal
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p qrsend --target "$t"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/qrsend \
            target/aarch64-apple-darwin/release/qrsend target/x86_64-apple-darwin/release/qrsend
          lipo -info target/universal-apple-darwin/release/qrsend
      - name: Check glibc floor
        # Required glibc builds must run on RHEL 8 / Debian 10 (glibc 2.28).
        if: contains(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          bin="target/${{ matrix.target }}/release/qrsend"
          need="$(readelf -V --wide "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "max GLIBC required by ${{ matrix.target }}: ${need:-none}"
          if [ -n "$MAX_GLIBC" ] && [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::${{ matrix.target }} requires GLIBC_$need (> $MAX_GLIBC)"
            exit 1
          fi
      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          exe=qrsend; [[ "${{ matrix.target }}" == *windows* ]] && exe=qrsend.exe
          "target/${{ matrix.target }}/release/$exe" --version
      - name: Collect
        run: |
          mkdir -p out/${{ matrix.target }}
          exe=qrsend; [[ "${{ matrix.target }}" == *windows* ]] && exe=qrsend.exe
          cp "target/${{ matrix.target }}/release/$exe" "out/${{ matrix.target }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/
