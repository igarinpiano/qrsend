[package]
name = "qrsend-js"
description = "WebAssembly core of the QRSend library for web pages: data to a stream of QR codes and back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.7"
js-sys = "0.3.106"
# Unencrypted transfers only: no keys, no encryption, no network offers.
qrsend-core = { path = "../qrsend-core", default-features = false, features = ["ruzstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
