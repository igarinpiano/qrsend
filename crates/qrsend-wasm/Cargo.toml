[package]
name = "qrsend-wasm"
description = "WebAssembly bindings of the QRSend protocol core for the web app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.7"
getrandom = { version = "0.2", features = ["js"] }
# (Newer crates use getrandom 0.4, which needs its browser backend named too:
# p256 0.14 for the link certificate.)
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.106"
qrsend-core = { path = "../qrsend-core", default-features = false, features = ["ruzstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
