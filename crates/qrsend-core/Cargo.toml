[package]
name = "qrsend-core"
description = "Protocol core of QRSend: send any data through a stream of QR codes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["qr", "raptorq", "fountain-code", "air-gap", "file-transfer"]
categories = ["encoding", "command-line-utilities"]

[dependencies]
blake3 = "1.8.7"
crc32fast = "1.5.2"
qrcode = { version = "0.14.1", default-features = false }
raptorq = "2.0.1"
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zstd = "0.14.0"

[dev-dependencies]
proptest = "1.11.0"

[features]
default = []
# Multithreaded zstd compression (native builds only).
zstdmt = ["zstd/zstdmt"]
