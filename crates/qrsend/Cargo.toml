[package]
name = "qrsend"
description = "Send any data — text, files, folders — through a stream of QR codes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["qr", "file-transfer", "air-gap", "raptorq", "cli"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
ctrlc = "3.5.2"
dirs = "7.0.0"
filetime = "0.2.29"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indicatif = "0.18.6"
minifb = { version = "0.29.0", optional = true }
qrsend-core = { version = "0.1.6", path = "../qrsend-core", features = ["zstdmt"] }
rand = "0.10.3"
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", optional = true }
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
default = ["window", "webrtc"]
# A network connection between this program and a browser (WebRTC through
# str0m). Its DTLS part builds a C library (aws-lc), which a few targets
# cannot link.
webrtc = ["dep:str0m", "dep:sha2"]
# Native window display for `qrsend send` (minifb).
window = ["dep:minifb"]
