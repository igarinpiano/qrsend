# cargo-deny: what the dependency tree may contain (run by the security
# workflow on every change and every week: new advisories arrive without any
# change here). `cargo deny check` runs it locally.

[graph]
# Every platform and feature that is built or published (the web build's
# wasm32 dependencies, Windows, macOS, the optional features).
all-features = true

[advisories]
# Vulnerabilities, unmaintained and unsound crates (RustSec), and versions
# withdrawn from crates.io. An advisory that does not apply is listed here
# with the reason, never silently.
version = 2
yanked = "deny"
ignore = [
    # crypto-bigint 0.5.5: timing variability in operations meant to be
    # constant-time. The fix is in 0.7.6 (we use 0.7.10 directly); the 0.5
    # series has no fixed release. 0.5 comes only through elliptic-curve 0.13
    # (p256 / p384 0.13), which the latest age (0.12.1, for its SSH and tagged
    # recipients, which QRSend does not use) and str0m (0.24.1, through dimpl
    # 0.7: the CLI's DTLS handshake) still depend on. Remove once they move to
    # elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "0.5.x has no fixed release; only through age 0.12.1 and str0m 0.24.1 (elliptic-curve 0.13)" },
    # basic-toml is unmaintained (no fixed release, no vulnerability). It reads
    # age's i18n.toml at compile time (i18n-config, under age's i18n-embed);
    # nothing received at run time goes through it.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained only; build-time parsing of age's own i18n.toml" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Licenses compatible with distributing QRSend under Apache-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Several versions of one crate are common (rand 0.8 for age, 0.10 for the
# CLI); a wildcard version requirement is not.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates only from crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
